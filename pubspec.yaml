name: spartan_chat_final
description: Spartan Chat messenger
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9

  shared_preferences: ^2.5.5
  image_picker: ^1.2.3
  web_socket_channel: ^3.0.3

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  path_provider: ^2.1.6

  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/