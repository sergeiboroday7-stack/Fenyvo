name: spartan_chat_final
description: Spartan Chat messenger
publish_to: "none"

version: 1.8.0+4224

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.9

  shared_preferences: ^2.5.5
  image_picker: 1.1.2
  file_picker: ^10.3.3
  public_file_saver: ^1.1.0
  web_socket_channel: ^3.0.3
  url_launcher: ^6.3.2

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  encrypt: ^5.0.3
  pointycastle: ^3.9.1

  path_provider: 2.1.5

  flutter_local_notifications: ^22.3.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0

  audioplayers: ^6.8.1
  record: 6.2.1
  video_player: ^2.14.0
  video_player_win: ^3.2.2
  # 1.5+ applies the legacy Kotlin Gradle Plugin only when AGP built-in
  # Kotlin is disabled, allowing the project to complete that migration later.
  flutter_webrtc: 1.6.1
  flutter_callkit_incoming: ^3.1.5
  permission_handler: 11.3.1
  # Official Signal Protocol core (X3DH/PQXDH + Double Ratchet).
  libsignal: 7.3.0
  # Long-term identity and ratchet state must not live in SharedPreferences.
  flutter_secure_storage: 9.2.4
  synchronized: ^3.4.1+2
  # Local QR rendering for Signal safety-number verification.
  qr_flutter: ^4.1.0
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  jni:
    path: third_party/jni

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/sounds/
