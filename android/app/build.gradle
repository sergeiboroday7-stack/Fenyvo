plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "kotlin-android"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")

if (!keystorePropertiesFile.exists()) {
    throw new GradleException("Missing android/key.properties")
}

keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

android {
    namespace "com.fenyvo.app"

    compileSdk 36
    ndkVersion "28.2.13676358"
    ndkPath = file("../../.ndk_local_28.2.13676358").absolutePath

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.fenyvo.app"

        minSdk = 24
        targetSdkVersion 36

        // Keep Android version synchronized with pubspec.yaml automatically.
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties["keyAlias"]
            keyPassword keystoreProperties["keyPassword"]
            storeFile rootProject.file(keystoreProperties["storeFile"])
            storePassword keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            shrinkResources false
        }
    }

    // Keep test updates compatible with the already-installed application,
    // even when ANDROID_USER_HOME points at an isolated build directory.
    def originalDebugKey = new File(
        System.getenv('USERPROFILE') ?: System.getProperty('user.home'),
        '.android/debug.keystore'
    )
    if (originalDebugKey.exists()) {
        signingConfigs.debug.storeFile = originalDebugKey
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
