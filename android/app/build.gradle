plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "kotlin-android"
    id "com.google.gms.google-services"
}

android {
    namespace "com.example.spartan_chat_final"

    compileSdk 36
    ndkVersion "28.2.13676358"
    ndkPath = file("../../.ndk_local_28.2.13676358").absolutePath

    compileOptions {
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        applicationId "com.example.spartan_chat_final"

        minSdk = 24
        targetSdkVersion 36

        versionCode 4118
        versionName "1.6.2"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    // Keep test updates compatible with the already-installed application,
    // even when ANDROID_USER_HOME points at an isolated build directory.
    def originalDebugKey = new File(
        System.getenv('USERPROFILE') ?: System.getProperty('user.home'),
        '.android/debug.keystore'
    )
    if (originalDebugKey.exists()) {
        signingConfigs.debug.storeFile = originalDebugKey
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"
}
